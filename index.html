<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAnime - Ad Free Player</title>
    <!-- Plyr Video Player Styling -->
    <link rel="stylesheet" href="https://plyr.io" />
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d0e12; color: #fff; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #ff4757; text-align: center; }
        
        /* Search Box styling */
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        input { padding: 12px; border: none; border-radius: 6px; width: 60%; background: #1e2026; color: #fff; font-size: 16px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; background: #ff4757; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }

        /* Interface layout splitting video and episode selector */
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }
        
        .player-section { background: #000; border-radius: 8px; overflow: hidden; }
        .episode-section { background: #1e2026; border-radius: 8px; padding: 15px; max-height: 500px; overflow-y: auto; }
        
        .episode-section h3 { margin-bottom: 15px; border-bottom: 1px solid #2f3542; padding-bottom: 8px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
        .ep-btn { padding: 10px; background: #2f3542; border: none; color: #fff; border-radius: 4px; cursor: pointer; text-align: center; }
        .ep-btn:hover { background: #ff4757; }
        .ep-btn.active { background: #ff4757; font-weight: bold; }

        /* Search Results layout */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .anime-card { background: #1e2026; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .anime-card:hover { transform: scale(1.03); }
        .anime-card img { width: 100%; height: 240px; object-fit: cover; }
        .anime-card p { padding: 10px; font-size: 14px; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .status-msg { text-align: center; color: #a4b0be; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>StreamAnime</h1>
        
        <!-- Search Form Component -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for anime (e.g. Naruto, One Piece)..." />
            <button onclick="searchAnime()">Search</button>
        </div>

        <!-- Render Target Grid for Search Queries -->
        <div id="search-results" class="results-grid"></div>

        <!-- Content Area: Video View Engine -->
        <div id="video-workspace" style="display: none;">
            <h2 id="current-anime-title" style="margin-bottom: 10px; color: #ffa502;"></h2>
            <div class="main-layout">
                <!-- Video Element Target Block -->
                <div class="player-section">
                    <video id="player" crossorigin="anonymous" controls playsinline></video>
                </div>
                <!-- Interactive Sidebar Selector -->
                <div class="episode-section">
                    <h3 id="episode-heading">Episodes</h3>
                    <div id="episode-list" class="ep-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hls.js Media Processing Library + Native Plyr Wrapper Scripting -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://plyr.io"></script>

    <script>
        // ⚠️ REPLACE THIS LINK WITH YOUR LIVE RENDER BACKEND PUBLIC URL
        const API_BASE_URL = "https://onrender.com";

        let currentSlug = "";
        let plyrInstance = null;
        let hlsInstance = null;

        // Automatically bind enter key to run search function
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchAnime();
        });

        // Pipeline Route 1: Query Search Framework
        function searchAnime() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = `<div class="status-msg">Searching database...</div>`;
            document.getElementById('video-workspace').style.display = "none";

            const API_BASE_URL = https://flenima.onrender.com;

            fetch(`${API_BASE_URL}/search?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    resultsContainer.innerHTML = "";
                    if (!data || data.length === 0) {
                        resultsContainer.innerHTML = `<div class="status-msg">No series discovered matching that name.</div>`;
                        return;
                    }
                    data.forEach(anime => {
                        const card = document.createElement('div');
                        card.className = 'anime-card';
                        card.onclick = () => loadAnimeDetails(anime.slug, anime.title);
                        card.innerHTML = `
                            <img src="${anime.image || 'https://placeholder.com'}" alt="${anime.title}">
                            <p title="${anime.title}">${anime.title}</p>
                        `;
                        resultsContainer.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    resultsContainer.innerHTML = `<div class="status-msg">Failed to query API. Ensure server is online.</div>`;
                });
        }

        // Pipeline Route 2: Fetch Info and Populate Episode Grid
        function loadAnimeDetails(slug, title) {
            currentSlug = slug;
            document.getElementById('search-results').innerHTML = ""; // Clean view layout
            document.getElementById('current-anime-title').innerText = title;
            
            const epListContainer = document.getElementById('episode-list');
            epListContainer.innerHTML = `<div class="status-msg">Fetching files...</div>`;
            document.getElementById('video-workspace').style.display = "block";

            fetch(`${API_BASE_URL}/info/${slug}`)
                .then(res => res.json())
                .then(data => {
                    epListContainer.innerHTML = "";
                    const episodes = data.episodes || [];
                    if (episodes.length === 0) {
                        epListContainer.innerHTML = `<div class="status-msg">0 Episodes Found.</div>`;
                        return;
                    }

                    // Loop through and append clickable buttons for each episode
                    episodes.forEach(ep => {
                        const btn = document.createElement('button');
                        btn.className = 'ep-btn';
                        btn.innerText = ep.number;
                        btn.id = `ep-btn-${ep.number}`;
                        btn.onclick = () => {
                            // Style handling for active buttons
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            startStreamingPipeline(slug, ep.number);
                        };
                        epListContainer.appendChild(btn);
                    });

                    // Autoplay the first episode link immediately upon choice loading
                    if (episodes[0]) {
                        document.getElementById(`ep-btn-${episodes[0].number}`).classList.add('active');
                        startStreamingPipeline(slug, episodes[0].number);
                    }
                })
                .catch(err => {
                    console.error(err);
                    epListContainer.innerHTML = `<div class="status-msg">Error loading episode indexes.</div>`;
                });
        }

        // Pipeline Route 3 & 4: Fetch Servers -> Decrypt FlixCloud Token -> Mount Stream Playback
        function startStreamingPipeline(slug, episodeNum) {
            const videoElement = document.getElementById('player');
            
            // Destroy older instances to clear processing loops across changes
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            videoElement.src = "";

            console.log(`Contacting servers for episode number: ${episodeNum}`);

            // Fetch the FlixCloud link for this episode [walterwhite-69/ReAnime.to-API]
            fetch(`${API_BASE_URL}/servers/${slug}/${episodeNum}`)
                .then(res => res.json())
                .then(serversData => {
                    // Try to fetch subbed HD-2 or HD-1 servers dynamically [walterwhite-69/ReAnime.to-API]
                    const serverList = serversData.sub || serversData.dub || [];
                    if (serverList.length === 0) {
                        alert("No streaming servers available for this file.");
                        return;
                    }
                    const targetFlixEmbedLink = serverList[0].dataLink;
